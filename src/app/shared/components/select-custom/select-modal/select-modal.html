<div class="card">
  <div class="card-header">
    <span class="card-title">Select Employee</span>
  </div>
  <div>
    <div class="px-3 py-2 card-container">
      <input class="" list="datalistOptions" id="exampleDataList" placeholder="Type to search..." />
    </div>
    <ul class="list-group">
      @for (item of data.item; track item.value) {
        <li
          class="list-group-item list-group-item-action"
          [class]="item.checked ? 'list-group-item-primary' : ''"
        >
          <input
            class="form-check-input me-2"
            type="checkbox"
            [(ngModel)]="item.checked"
            [id]="item.value"
          />
          <label class="form-check-label stretched-link" [for]="item.value">{{ item.name }}</label>
        </li>
      } @empty {
        <li class="list-group-item">
          <label class="form-check-label stretched-link"> No Data</label>
        </li>
      }
    </ul>
  </div>

  <div class="d-flex justify-content-end gap-2 p-2 border-top">
    <button type="button" class="btn btn-light" (click)="onCancel()">Clear</button>
    <button type="button" class="btn btn-primary" (click)="onSelect()">Select</button>
  </div>
</div>
